spring.application.name=BMS

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/BankingInterface
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Check the connection to database, metrics
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.server.port=8001

# logging
logging.file.name=logs/bank.log
logging.level.com.shivam.bankinginterface=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %-18([%thread]) txn=%-12X{txn} acct=%-8X{acct} op=%-10X{op} %-20logger{0} : %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} | %-5level | %-10thread | txn=%-12X{txn} | acct=%-8X{acct} | op=%-10X{op} | %-20logger{0} | %msg%n

logging.level.com.zaxxer.hikari=WARN
spring.main.log-startup-info=false